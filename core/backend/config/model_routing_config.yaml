# AIX autonomous lane changes must run through scripts/run_aix_lane_gauntlet.sh before deploy.
schema_version: aix.model_routing_config.v2
config_id: aix-model-routing-pools
version: 2

roles:
  planner:
    default_persona: structured_logician
  coder:
    default_persona: mutation_artisan
  verifier:
    default_persona: surgical_auditor
  observer:
    default_persona: high_speed_scout
  consultant:
    default_persona: domain_consultant

personas:
  structured_logician:
    purpose: planner
    selection_mode: ordered_fallback
    retry_budget:
      semantic_validation_failure: 1
      anchor_validation: 2
      mutation_missing: 1
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 500
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [planner, primary, codex, stable_baseline]
      - provider: openrouter
        model: deepseek/deepseek-v3.2
        priority: 80
        supports_json_object: true
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 500
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [planner, primary, reasoning, cost_effective]
      - provider: openrouter
        model: mistralai/codestral-2508
        priority: 80
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 60
        max_retries: 1
        retry_backoff_ms: 500
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [planner, fallback, structured_output, protocol]
  mutation_artisan:
    purpose: coder
    selection_mode: ordered_fallback
    retry_budget:
      semantic_validation_failure: 1
      anchor_validation: 2
      mutation_missing: 1
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, primary, codex, stable_baseline]
      - provider: openrouter
        model: deepseek/deepseek-v3.2
        priority: 80
        supports_json_object: true
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, primary, implementation, repair]
      - provider: openrouter
        model: mistralai/codestral-2508
        priority: 60
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, fallback, complex]

  mutation_repair_artisan:
    purpose: coder
    selection_mode: ordered_fallback
    retry_budget:
      semantic_validation_failure: 1
      anchor_validation: 2
      mutation_missing: 1
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, repair, primary, codex, stable_baseline]
      - provider: openrouter
        model: deepseek/deepseek-v3.2
        priority: 80
        supports_json_object: true
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, repair, primary]
      - provider: openrouter
        model: mistralai/codestral-2508
        priority: 60
