  grounded_protocol_planner:
    purpose: planner
    selection_mode: ordered_fallback
    retry_budget:
      semantic_validation_failure: 1
      anchor_validation: 2
      mutation_missing: 1
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
