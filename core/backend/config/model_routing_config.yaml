        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, cli_executor, codex, mutation, bakeoff_candidate, cost_probe]

  surgical_auditor:
    purpose: verifier
    selection_mode: ordered_fallback
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
