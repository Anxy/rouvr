        cost_tier: premium
        timeout_seconds: 180
        max_retries: 1
        retry_backoff_ms: 250
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, repair, fallback, complex]

  cli_mutation_artisan:
    purpose: coder
    selection_mode: ordered_fallback
    retry_budget:
      semantic_validation_failure: 0
      anchor_validation: 0
      mutation_missing: 0
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: false
        cost_tier: premium
        timeout_seconds: 1800
        max_retries: 0
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [coder, cli_executor, codex, mutation, primary, stable_baseline]
      - provider: openrouter
        model: openai/gpt-5.3-codex
        priority: 90
        supports_json_object: false
        cost_tier: premium
