        cost_tier: premium
        timeout_seconds: 180
        max_retries: 0
        tags: [verifier, primary, codex, stable_baseline]
      - provider: openrouter
        model: deepseek/deepseek-v3.2-speciale
        priority: 80
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 0
        tags: [verifier, semantic_correctness]
      - provider: openrouter
        model: deepseek/deepseek-v3.2
        priority: 60
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 0
        tags: [verifier, fallback, semantic_correctness]

  high_speed_scout:
    purpose: observer
    selection_mode: ordered_fallback
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 180
        max_retries: 0
        tags: [observer, primary, codex, stable_baseline]
      - provider: openrouter
        model: nvidia/nemotron-3-super-120b-a12b
        priority: 80
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 0
        tags: [observer, budget, trace]

  domain_consultant:
    purpose: consultant
    selection_mode: ordered_fallback
    candidates:
      - provider: openrouter
        model: openai/gpt-5.1-codex
        priority: 100
        supports_json_object: true
