        tags: [planner, grounded, protocol_extension, primary, codex, stable_baseline]
      - provider: openrouter
        model: mistralai/codestral-2508
        priority: 60
        supports_json_object: true
        cost_tier: premium
        timeout_seconds: 60
        max_retries: 1
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [planner, grounded, protocol_extension, primary, reasoning]
      - provider: openrouter
        model: deepseek/deepseek-v3.2
        priority: 60
        supports_json_object: true
        cost_tier: balanced
        timeout_seconds: 180
        max_retries: 1
        circuit_breaker_window_seconds: 1800
        circuit_breaker_failure_threshold: 2
        tags: [planner, grounded, protocol_extension, fallback, structured_output]
routing:
  planning:
    role: planner
    default_persona: structured_logician
    conditions:
      - when:
          oversized: true
        persona: structured_logician
      - when:
          complexity: high
        persona: structured_logician
  planning_safe:
    role: planner
    default_persona: structured_logician
    conditions:
      - when:
          mutation_kind: bounded_method_protocol_extension
          oversized: true
        persona: structured_logician
      - when:
          mutation_kind: bounded_method_protocol_extension
        persona: grounded_protocol_planner
  structured_logician:
    role: planner
    default_persona: structured_logician
  mutation:
    role: coder
    default_persona: mutation_artisan
  cli_mutation:
    role: coder
    default_persona: cli_mutation_artisan
  mutation_repair:
    role: coder
    default_persona: mutation_repair_artisan
  mutation_extraction:
    role: coder
    default_persona: mutation_artisan
    conditions:
      - when:
          oversized: true
        persona: structured_logician
      - when:
          complexity: high
        persona: structured_logician
      - when:
          task_family: mutation_extraction
          estimated_tokens_gte: 2000
        persona: structured_logician
  repair:
    role: coder
    default_persona: mutation_artisan
  verification:
    role: verifier
    default_persona: surgical_auditor
  diagnostic:
    role: observer
    default_persona: high_speed_scout
  observation:
    role: observer
    default_persona: high_speed_scout

policy:
  yaml_only: true
  allow_metadata_override: false
  allow_instruction_override: false
  allow_repo_profile_override: false
  allow_builtin_fallbacks: false

metadata:
  operator_notes:
    owner: aix-operators
    precedence: yaml_config_only
  bakeoff:
    cli_mutation:
      source_persona: cli_mutation_artisan
      comparison_goal: quality_capability_price_balance
      canonical_candidates:
        - openrouter/openai/gpt-5.1-codex
        - openrouter/openai/gpt-5.3-codex
        - openrouter/openai/gpt-5.1-codex-mini
