# Local dev stack for Rouvr. Not hardened; do not expose publicly.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rouvr
      POSTGRES_PASSWORD: rouvr
      POSTGRES_DB: rouvr
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rouvr"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: rouvr
      POSTGRES_PWD: rouvr
      POSTGRES_SEEDS: db
    depends_on:
      db: {condition: service_healthy}
    ports: ["7233:7233"]
  temporal-ui:
    image: temporalio/ui:2.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]
    ports: ["8080:8080"]
  ledger:
    # Rouvr ledger (WorkHub-lite). The legacy core client reads WORKHUB_API_URL.
    image: python:3.13-slim
    working_dir: /app
    volumes: ["..:/app:ro"]
    environment:
      ROUVR_LEDGER_DATABASE_URL: postgresql+psycopg://rouvr:rouvr@db:5432/rouvr
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "pip install -q fastapi uvicorn sqlalchemy 'psycopg[binary]' && uvicorn ledger.app:app --host 0.0.0.0 --port 8221"
    ports: ["8221:8221"]
